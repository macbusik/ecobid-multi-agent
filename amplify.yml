version: 1
frontend:
  phases:
    preBuild:
      commands:
        - bash scripts/amplify-build.sh
    build:
      commands:
        - echo "Build completed in preBuild phase"
  artifacts:
    baseDirectory: frontend/.next
    files:
      - '**/*'
  cache:
    paths:
      - frontend/.next/cache/**/*
      - frontend/.npm/**/*
      - frontend/node_modules/**/*
